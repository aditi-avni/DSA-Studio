<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tree.css">
    <title>Tree Traversal Explorer</title>
</head>
<body>

    <div class="main-container">

        <div class="left-section">

            <h1 class="h1" id="title"> Tree Traversal </h1>

            <h2 class="h2" id="input">Input Array</h2>

            <div class="input-section">
                <input
                    type="text"
                    id="input-array"
                    placeholder="Example: 10 5 15 3 7"
                >

                <button class = "button" id="build-tree">
                    Build Tree
                </button>
            </div>

            <h3 class="h3" id="select">Select Traversal</h3>

            <div class="traversal-section">

                <select id="traversal-type">
                    <option value="inorder">Inorder</option>
                    <option value="preorder">Preorder</option>
                    <option value="postorder">Postorder</option>
                    <option value="levelorder">Level Order</option>
                </select>

                <button class="button" id="traverse-tree">
                    Traverse Tree
                </button>

            </div>

            <div class="output-section">

                <h2 class="h2" id="output">Traversal Output</h2>

                <div id="traversal-output">
                    Output will appear here
                </div>

            </div>

        </div>

        <div class="right-section">

            <h2 class="h2" id="visual-tree">Visual Tree</h2>

            <div id="tree-container">

                <!-- BST will be rendered here -->

            </div>

        </div>

    </div>

</body>
</html>
